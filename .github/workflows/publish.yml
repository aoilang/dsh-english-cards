name: Publish to npm

# Publishing runs when a GitHub release is published. Create the release from a
# tag whose version matches package.json (for example tag v0.1.0 with version
# 0.1.0); a prerelease is published under the `next` dist-tag.
#
# Authentication uses npm trusted publishing (OIDC), not a stored token: GitHub
# hands the job a short-lived identity token, npm exchanges it for publish
# access, and provenance is attached to the upload.
#
# One-time setup on npmjs.com: package Settings -> Trusted Publisher -> GitHub
# Actions, with user `aoilang`, repository `dsh-english-cards`, and workflow
# filename `publish.yml` (filename only, with its extension). The package must
# already exist, and a new configuration must publish within two days of being
# created, so publish the first version by hand (`npm login && npm publish`)
# and add the publisher right before the next release. No NPM_TOKEN secret is
# involved; delete one if it is still configured.
on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for the OIDC token npm exchanges for publish access.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          # Leave the checkout credential out of .git/config.
          persist-credentials: false

      - name: Set up Node and the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, and the npm bundled with Node 24
      # is not guaranteed to be new enough. Pin a known-good release rather than
      # `latest`, which has shipped broken builds.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Verify the release tag matches package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi
          echo "Publishing version $version"

      - name: Run plugin tests
        run: node --test test/*.test.mjs

      # No NODE_AUTH_TOKEN: npm picks up the OIDC identity from the runner and
      # publishes with provenance.
      - name: Publish to npm
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --tag next --provenance
          else
            npm publish --provenance
          fi
